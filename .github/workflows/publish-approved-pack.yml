name: Validate and publish community packs

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: community-pack-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ vars.PORTAL_BASE_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out publication repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Firebase client SDK
        run: npm install --no-save firebase@13.1.0

      - name: Download current Kippo Lab validator/publisher
        env:
          PORTAL_BASE_URL: ${{ vars.PORTAL_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          base="${PORTAL_BASE_URL%/}"
          mkdir -p .publisher
          curl --fail --location --retry 3 "$base/github-publisher.mjs" -o .publisher/github-publisher.mjs
          curl --fail --location --retry 3 "$base/pack-validator.js" -o .publisher/pack-validator.mjs
          curl --fail --location --retry 3 "$base/firebase-config.js" -o .publisher/firebase-config.mjs

      - name: Validate queued submissions and publish approved packs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .publisher/github-publisher.mjs

      - name: Commit catalogue and validation results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Kippo Lab Data Pack Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add catalog.json validation-results.json publication-results.json
          if git diff --cached --quiet; then
            echo "No publication-state changes."
            exit 0
          fi
          git commit -m "Update community pack publication state"
          git push
